# dsh-learn-plugin bundle patch
#
# 本文件是 npm 包的 `dsh.bundle.patch` 声明层。通过
#
#   dsh plugin --profile <name> add <本包路径或 dsh-learn-plugin>
#
# 安装后，CLI 会把本包追加进 `dsh.profile.bundles`，启动时此补丁生效，
# 挂载注册 /learn /learn-next /learn-review 命令的 cordis 插件。
- insert:
    - id: dsh-learn
      name: 'dsh-learn-plugin'
